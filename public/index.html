<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024">
  <!-- Fallback full-page reload every hour in case JS stops working -->
  <meta http-equiv="refresh" content="3600">
  <title>Home Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div id="dashboard">

    <!-- Clock widget — full-width top row -->
    <div id="widget-clock" class="widget">
      <div id="clock-time">--:--:--</div>
      <div id="clock-date">---</div>
    </div>

    <!-- Bottom row: weather left, calendar middle, news right -->
    <div id="bottom-row">

      <div id="widget-weather" class="widget">
        <div id="weather-loading" class="status-msg">Loading weather…</div>
        <div id="weather-content" style="display:none">
          <div id="weather-city"></div>
          <div id="weather-temp"></div>
          <div id="weather-range"></div>
          <div id="weather-desc"></div>
          <div id="weather-details"></div>
        </div>
        <div id="weather-error" class="error-msg" style="display:none">⚠ updating…</div>
      </div>

      <!-- Calendar: a card that flips. Front = today/tomorrow events,
           back = choose which iCloud calendars to show. Tap the header to flip. -->
      <div id="widget-calendar">
        <div id="cal-flipper">

          <div id="cal-front" class="cal-face widget">
            <div id="cal-front-header" class="cal-header">
              <span class="cal-header-title">Calendar</span>
              <span class="cal-header-action">&#9881;</span>
            </div>
            <div id="calendar-loading" class="status-msg">Loading calendar…</div>
            <div id="calendar-error" class="error-msg" style="display:none">⚠ updating…</div>
            <div id="calendar-content" style="display:none"></div>
          </div>

          <div id="cal-back" class="cal-face widget">
            <div id="cal-back-header" class="cal-header">
              <span class="cal-header-title">Choose calendars</span>
              <span class="cal-header-action">Done</span>
            </div>
            <div id="cal-settings-status" class="status-msg"></div>
            <ul id="cal-settings-list"></ul>
          </div>

        </div>
      </div>

      <div id="widget-news" class="widget">
        <div id="news-loading" class="status-msg">Loading news…</div>
        <div id="news-error" class="error-msg" style="display:none">⚠ updating…</div>
        <div id="news-content" style="display:none">

          <!-- Ukraine news -->
          <div class="news-col">
            <div class="news-col-label">Ukraine</div>
            <ul id="news-list-ukraine" class="news-col-list"></ul>
          </div>

        </div><!-- /#news-content -->
      </div>

    </div><!-- /#bottom-row -->

  </div><!-- /#dashboard -->

  <!-- Full-screen black overlay shown during 22:00–07:00 -->
  <div id="sleep-screen"></div>

  <!-- ES5-compatible scripts, loaded in dependency order -->
  <script src="js/weather.js"></script>
  <script src="js/news.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
